# Kinect 深度相机专用 costmap 参数
# 解决窄视场角 (57°) 导致的误判: "机器人脚下有障碍"

# ── 扫描传感器: 容忍 inf/NaN，只标记近距离障碍 ──
obstacle_layer:
  observation_sources: scan
  scan:
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    inf_is_valid: true          # 忽略 NaN/Inf (深度相机常产生)
    min_obstacle_height: 0.0    # 不设高度下限 (激光扫描是2D的)
    max_obstacle_height: 2.0    # 不设高度上限
    obstacle_range: 2.5
    raytrace_range: 3.0

# ── 膨胀层: 减小膨胀半径 ──
inflation_layer:
  inflation_radius: 0.3
  cost_scaling_factor: 3.0

# ── 机器人半径: 减小占用范围 ──
robot_radius: 0.15

# ── 禁用恢复行为 (Kinect 窄视场看不全周围) ──
recovery_behaviors:
  - {name: conservative_reset, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset, type: clear_costmap_recovery/ClearCostmapRecovery}
