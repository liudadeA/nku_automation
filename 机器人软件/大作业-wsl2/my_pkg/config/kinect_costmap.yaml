# Kinect 深度相机专用 costmap 参数
# 多行扫描后有效数据更丰富, 适当扩大检测和清除范围

# ── 扫描传感器: 容忍 inf/NaN ──
obstacle_layer:
  observation_sources: scan
  scan:
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    inf_is_valid: true          # 忽略 NaN/Inf (深度相机常产生)
    min_obstacle_height: 0.0    # 不设高度下限 (激光扫描是2D的)
    max_obstacle_height: 2.0    # 不设高度上限
    obstacle_range: 3.5         # 标记障碍物范围 (对齐 range_max=10.0 的有效距离)
    raytrace_range: 5.0         # 清除障碍物范围 (利用更远射线清除虚障)

# ── 膨胀层: 减小膨胀半径 ──
inflation_layer:
  inflation_radius: 0.3
  cost_scaling_factor: 3.0

# ── 机器人半径: 减小占用范围 ──
robot_radius: 0.15

# ── 禁用恢复行为 (Kinect 窄视场看不全周围) ──
recovery_behaviors:
  - {name: conservative_reset, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset, type: clear_costmap_recovery/ClearCostmapRecovery}
